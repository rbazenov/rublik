<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#221A4A;background:#F6F5FF;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
svg{display:block}
.wrap-pad{padding:26px 30px 46px;max-width:1000px;margin:0 auto}
/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#2A2158,#221A4A);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;padding:0 6px}
.logo small{color:#8F87C7;font-weight:700;font-size:11px}
.side-profile{background:rgba(255,255,255,.06);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.avatar-big{width:52px;height:52px;flex:none;border:0;border-radius:16px;background:rgba(255,255,255,.12);font-size:28px;cursor:pointer;transition:.15s}
.avatar-big:hover{background:rgba(255,255,255,.22)}
.side-profile>div{flex:1;min-width:0}
.side-profile b{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-profile span{font-size:12px;color:#B9B2EA;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.side-nav{display:flex;flex-direction:column;gap:4px}
.snav{display:flex;align-items:center;gap:10px;border:0;cursor:pointer;text-align:left;font-weight:800;font-size:14.5px;color:#B9B2EA;background:transparent;border-radius:13px;padding:11px 13px;transition:.15s;white-space:nowrap}
.snav:hover{background:rgba(255,255,255,.08);color:#fff}
.snav.on{background:#6C5CE7;color:#fff;box-shadow:0 6px 16px rgba(108,92,231,.4)}
.snav .badge{margin-left:auto;font-size:11px;font-weight:900;background:#F5A623;color:#221A4A;border-radius:99px;padding:2px 8px}
.side-xp{background:rgba(255,255,255,.06);border-radius:16px;padding:13px}
.side-xp .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:#B9B2EA}
.side-xp .row b{color:#FFC94D}
.xpbar{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#F5A623,#FFD466);border-radius:99px;transition:width .4s}
.side-back{margin-top:auto;text-align:center;font-size:13px;font-weight:800;color:#8F87C7;padding:10px;border-radius:12px}
.side-back:hover{background:rgba(255,255,255,.08);color:#fff}
.burger{display:none;width:42px;height:42px;flex:none;border:0;border-radius:13px;background:rgba(255,255,255,.12);color:#fff;font-size:19px;cursor:pointer;align-items:center;justify-content:center}
.burger:hover{background:rgba(255,255,255,.22)}
.menu-head{display:none;justify-content:space-between;align-items:center;padding:6px 10px 10px;color:#B9B2EA;font-weight:900;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.menu-close{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.menu-close:hover{background:rgba(255,255,255,.2)}
.content{min-width:0}
@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px}
  .side .logo{display:none}
  .burger{display:flex}
  .side-nav{display:none;width:100%}
  .side.menu-open .side-nav{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.07);border-radius:16px;padding:8px;animation:menuIn .18s ease}
  .menu-head{display:flex}
  .side-xp{width:100%}
  .side-back{margin:0}
  .wrap-pad{padding:20px 16px 40px}
}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* ---------- элементы ---------- */
.tab{display:none}
.tab.on{display:block}
.h-title{font-size:clamp(22px,3vw,30px);font-weight:900;letter-spacing:-.02em}
.h-sub{color:#5C5C7A;font-size:15px;margin-top:4px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(34,26,74,.06);border:1px solid #EFEDFA}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-weight:800;font-size:15px;border-radius:13px;padding:12px 20px;background:#6C5CE7;color:#fff;transition:.15s;box-shadow:0 6px 14px rgba(108,92,231,.3)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:#221A4A;box-shadow:inset 0 0 0 2px #E4E1F7}
.btn.amber{background:#F5A623;box-shadow:0 6px 14px rgba(245,166,35,.35)}
.btn.green{background:#1FB574;box-shadow:0 6px 14px rgba(31,181,116,.3)}
.btn.red{background:#FF5E6C;box-shadow:0 6px 14px rgba(255,94,108,.3)}
.btn.sm{padding:8px 15px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:99px;padding:5px 12px;background:#EEEBFF;color:#6C5CE7}
.chip.gold{background:#FFF3D6;color:#B87500}
.chip.green{background:#DDF6EA;color:#158A57}
.warnbar{display:none;background:#FFF3D6;border:1px solid #F5D68A;color:#8A5E00;border-radius:14px;padding:12px 16px;font-size:13.5px;font-weight:700;margin-bottom:16px}
.warnbar.show{display:block}
/* профиль / главая */
.hero-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero-avatar{width:76px;height:76px;border-radius:22px;background:#fff;box-shadow:0 10px 26px rgba(34,26,74,.12);font-size:42px;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;transition:.15s}
.hero-avatar:hover{transform:scale(1.05)}
.stat-mini{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(34,26,74,.06)}
.stat-mini span{color:#8A8AA6;font-size:12px;font-weight:700}
/* программа */
.lvl-block{margin-top:20px}
.lvl-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.lvl-head .dot{width:14px;height:14px;border-radius:5px;background:var(--c)}
.lvl-head h3{font-size:18px}
.lvl-head .gr{font-size:12.5px;color:#8A8AA6;font-weight:800}
.lvl-head .pr{margin-left:auto;font-size:12.5px;font-weight:900;color:#1FB574}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.mod{border:2px solid #E8E5F8;border-radius:16px;padding:13px 14px;background:#fff;display:flex;gap:10px;align-items:center;transition:.15s}
.mod .mnum{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;background:#F1EFFB;color:#9A96C2}
.mod b{display:block;font-size:13.5px;line-height:1.3}
.mod span{font-size:11.5px;color:#8A8AA6;font-weight:700}
.mod.done{border-color:#BEEBD4;background:#F4FCF8}
.mod.done .mnum{background:#1FB574;color:#fff}
.mod.open{border-color:#6C5CE7;cursor:pointer;box-shadow:0 8px 20px rgba(108,92,231,.16)}
.mod.open .mnum{background:#6C5CE7;color:#fff}
.mod.open:hover{transform:translateY(-2px)}
.mod.locked{opacity:.45}
/* копилка */
.goal-card{background:linear-gradient(135deg,#2A2158,#221A4A);color:#fff;border:0}
.goal-card .lbl{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#B9B2EA}
.goal-big{font-size:34px;font-weight:900;margin:6px 0}
.goal-big small{font-size:15px;color:#B9B2EA}
.gbar{height:12px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin:8px 0 10px}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#F5A623,#FFD466);border-radius:99px}
.goal-card .sub{font-size:13px;color:#C9C3F5;font-weight:600}
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.jar{background:#fff;border:2px solid #E8E5F8;border-radius:16px;padding:12px 8px;text-align:center}
.jar .fw{height:84px;border-radius:10px;background:#F1EFFB;position:relative;overflow:hidden;margin:8px 0 6px}
.jar .ff{position:absolute;bottom:0;left:0;right:0;background:var(--jc);border-radius:0 0 8px 8px}
.jar b{font-size:16px;display:block}
.jar span{font-size:11px;color:#8A8AA6;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#F1EFFB;border-radius:13px;padding:5px}
.seg button{border:0;cursor:pointer;font-weight:800;font-size:13.5px;border-radius:9px;padding:9px;background:transparent;color:#6A6A8A;transition:.15s}
.seg button.on{background:#fff;color:#221A4A;box-shadow:0 3px 8px rgba(34,26,74,.12)}
.seg button.on.in{color:#158A57}
.seg button.on.out{color:#D63A4E}
input[type=text],input[type=number],select{width:100%;border:2px solid #E8E5F8;border-radius:12px;padding:11px 13px;font:inherit;font-size:14.5px;font-weight:600;color:#221A4A;outline:none;background:#fff}
input:focus,select:focus{border-color:#6C5CE7}
label.f{display:block;font-size:12.5px;font-weight:800;color:#5C5C7A;margin:0 0 6px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #F1EFFB}
.tx:last-child{border-bottom:0}
.tx .ti{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:#F6F5FF}
.tx .tn{flex:1;min-width:0}
.tx .tn b{display:block;font-size:14px}
.tx .tn span{font-size:11.5px;color:#8A8AA6;font-weight:600}
.tx .ta{font-weight:900;font-size:15px;white-space:nowrap}
.tx .ta.plus{color:#158A57}
.tx .ta.minus{color:#D63A4E}
.tx .del{border:0;background:transparent;color:#C9C3F5;cursor:pointer;font-size:15px;padding:4px;border-radius:8px}
.tx .del:hover{background:#FFEDF0;color:#FF5E6C}
/* миссии */
.mission{display:flex;gap:14px;align-items:center;background:#fff;border-radius:18px;border:1px solid #EFEDFA;padding:16px 18px;box-shadow:0 8px 20px rgba(34,26,74,.05)}
.mission.done{border-color:#BEEBD4;background:#F4FCF8}
.mcheck{flex:none;width:44px;height:44px;border-radius:14px;border:2.5px solid #E4E1F7;background:#fff;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;color:#fff;transition:.15s}
.mcheck:hover{border-color:#6C5CE7}
.mission.done .mcheck{background:#1FB574;border-color:#1FB574}
.mission .mi{flex:none;font-size:26px}
.mission .mt b{display:block;font-size:15px}
.mission .mt span{font-size:13px;color:#5C5C7A}
.mission .mx{margin-left:auto;flex:none}
/* достижения */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:18px}
.achc{background:#fff;border:2px solid #EFEDFA;border-radius:18px;padding:18px;text-align:center;box-shadow:0 8px 20px rgba(34,26,74,.05)}
.achc .ae{font-size:38px}
.achc b{display:block;font-size:15px;margin:8px 0 4px}
.achc span{font-size:12.5px;color:#8A8AA6;font-weight:600}
.achc.earned{border-color:#F5D68A;background:linear-gradient(180deg,#FFFCF2,#FFF7E0);box-shadow:0 12px 26px rgba(245,166,35,.18)}
.achc.locked{opacity:.5;filter:grayscale(1)}
.achc .when{display:block;margin-top:8px;font-size:11px;color:#B87500;font-weight:800}
/* тосты */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:#221A4A;color:#fff;font-weight:800;font-size:14px;border-radius:14px;padding:13px 18px;box-shadow:0 14px 34px rgba(34,26,74,.45);animation:tin .25s}
.toast.gold{background:#F5A623;color:#221A4A}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* модалка */
.modal{position:fixed;inset:0;background:rgba(34,26,74,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:22px;padding:26px;max-width:430px;width:100%;box-shadow:0 30px 70px rgba(34,26,74,.35);animation:tin .2s}
.mbox h3{font-size:20px;margin-bottom:8px;letter-spacing:-.01em}
.mbox p{color:#5C5C7A;font-size:14.5px}
.mbox .mrow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.avgrid button{border:2px solid #F1EFFB;background:#fff;border-radius:13px;font-size:24px;padding:8px 0;cursor:pointer;transition:.12s}
.avgrid button:hover{border-color:#6C5CE7;transform:scale(1.08)}
.note{font-size:12.5px;color:#8A8AA6;font-weight:600;margin-top:14px}

.rc-root{position:fixed;right:18px;bottom:18px;z-index:9999;font-family:inherit}
.rc-fab{width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#6C5CE7,#5A3FD1);color:#fff;font-size:25px;cursor:pointer;box-shadow:0 10px 26px rgba(108,92,231,.45);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .18s}

.rc-teaser .rc-tx{color:#9A96C2;font-weight:800;font-size:12px;padding:2px 4px}

.rc-head{background:linear-gradient(135deg,#2A2158,#221A4A);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;flex:none}
.rc-ava{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#F5A623,#FFC94D);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.rc-head b{font-size:14.5px;display:block;line-height:1.25}
.rc-status{font-size:11.5px;color:#B9B2EA;font-weight:700}
.rc-status i{color:#2ECC71;font-style:normal}
.rc-close{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;width:28px;height:28px;border-radius:9px;cursor:pointer;font-size:13px}
.rc-close:hover{background:rgba(255,255,255,.22)}
.rc-msgs{flex:1;overflow-y:auto;padding:12px;background:#F8F7FE;display:flex;flex-direction:column;gap:8px}
.rc-m{display:flex;gap:7px;align-items:flex-end;max-width:88%}
.rc-me{align-self:flex-end;flex-direction:row-reverse}
.rc-mava{font-size:17px;flex:none;width:26px;text-align:center}
.rc-bub{background:#fff;border:1px solid #EFEDFA;border-radius:13px 13px 13px 4px;padding:9px 12px;font-size:13.5px;line-height:1.45;color:#221A4A;white-space:pre-line;word-wrap:break-word}
.rc-me .rc-bub{background:#6C5CE7;color:#fff;border:0;border-radius:13px 13px 4px 13px}
.rc-typing .rc-bub{display:flex;gap:4px;padding:13px 14px}
.rc-d{width:7px;height:7px;border-radius:50%;background:#B9B2EA;animation:rcB 1.2s infinite}
.rc-d:nth-child(2){animation-delay:.2s}.rc-d:nth-child(3){animation-delay:.4s}
@keyframes rcB{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.rc-chips{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#fff;border-top:1px solid #F1EFFC;flex:none}
.rc-chip{border:1px solid #E4E1F7;background:#fff;color:#4A4A68;font-size:12px;font-weight:700;border-radius:99px;padding:6px 11px;cursor:pointer;white-space:nowrap;flex:none;font-family:inherit}
.rc-chip:hover{background:#F4F2FE;color:#6C5CE7;border-color:#6C5CE7}
.rc-inputrow{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #F1EFFC;flex:none}
.rc-inputrow input{flex:1;border:1px solid #E4E1F7;border-radius:12px;padding:10px 12px;font:inherit;font-size:13.5px;outline:none;color:#221A4A;min-width:0;background:#fff}
.rc-inputrow input:focus{border-color:#6C5CE7}
.rc-send{border:0;background:#6C5CE7;color:#fff;border-radius:12px;width:42px;cursor:pointer;font-size:16px;flex:none}
.rc-send:hover{background:#5A3FD1}
.rc-ic{display:block;border-radius:50%}
.rc-fab .rc-ic{width:31px;height:31px}
.rc-ava{background:none}
.rc-ava .rc-ic{width:34px;height:34px}
.rc-mava{height:26px}
.rc-mava .rc-ic{width:26px;height:26px}
@media(max-width:560px){
  .rc-root{right:12px;bottom:12px}
  .rc-win{right:-6px;bottom:64px;height:72vh;max-height:72vh}
  .rc-inputrow input{font-size:16px}
}

 {id:'p9', e:'🧮', t:'Цена привычки', d:'Посчитай, сколько в месяц стоит твоя «сладкая неделя» или любимый перекус', xp:15},
 {id:'p10',e:'🎁', t:'Банк «Делись»', d:'Отложи 10% денег на подарок близкому человеку', xp:20},
 {id:'p11',e:'🚌', t:'Верный маршрут', d:'Посчитай, сколько выходит на проезд за неделю и есть ли выгоднее тариф', xp:15},
 {id:'p12',e:'🏦', t:'Экскурсия в банк', d:'Загляни в приложение банка вместе с родителями: что там видно про карту?', xp:20}
];
var ACHS = [
 {id:'first_lesson', e:'🎬', t:'Первый шаг',            d:'Пройти первый урок курса'},
 {id:'quiz5',        e:'🧠', t:'Квиз-мастер',           d:'Отвечать 5 из 5 в квизе'},
 {id:'mini9',        e:'🟢', t:'Хочу ≠ нужно',          d:'9+ из 10 в мини-игре «Хочу или нужно»'},
 {id:'streak3',      e:'🔥', t:'Разогрев',              d:'Заниматься 3 дня подряд'},
 {id:'jar1000',      e:'🐷', t:'Полная банка',          d:'1000 ₽ в банке «Копи»'},
 {id:'goal',         e:'🚀', t:'Цель достигнута',       d:'Накопить на свою цель'},
 {id:'missions3',    e:'🕵️', t:'Агент заданий',         d:'Выполнить 3 миссии'},
 {id:'tx5',          e:'📓', t:'Дневник денег',         d:'Сделать 5 записей в копилке'}
];
var AVATARS = ['🦉','🦊','🐼','🐙','🦄','🐸','🐯','🐨','🚀','🧠','🐷','👑','🦖','🐝','🐳','⚡'];

/* ==================== состояние ==================== */
var KEY = 'rublik_cabinet_v1';
var DEFAULT = {
  v:1,
  profile:{ name:'Юный финансист', avatar:'🦉', grade:'5–7 класс' },
  xp:0,
  demoLesson:null,
  miniGame:null,
  awarded:{ demo:false, mini:false },
  goal:{ name:'Наушники', target:4000 },
  tx:[],
  missionsDone:{},
  ach:{},
  seen:[],
  settings:{ weekly:700 }
};
var state;
var txType = 'in';

function loadState(){
  var saved = lsGet(KEY);
  state = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), saved || {});
  state.profile  = Object.assign({}, DEFAULT.profile,  state.profile || {});
  state.goal     = Object.assign({}, DEFAULT.goal,     state.goal || {});
  state.settings = Object.assign({}, DEFAULT.settings, state.settings || {});
  state.awarded  = Object.assign({}, DEFAULT.awarded,  state.awarded || {});
  mergeLanding();
  touchToday();
  checkAch(false);
}
function save(){ lsSet(KEY, state); }
function mergeLanding(){
  var d = lsGet('rublik_demo_lesson');
  if(d && (!state.demoLesson || (d.date||0) > (state.demoLesson.date||0))) state.demoLesson = d;
  var m = lsGet('rublik_mini_game');
  if(m && (!state.miniGame || (m.date||0) > (state.miniGame.date||0))) state.miniGame = m;
  if(state.demoLesson && !state.awarded.demo){ state.awarded.demo = true; state.xp += 50; toast('🎬 +50 XP — демо-урок пройден!'); }
  if(state.miniGame && state.miniGame.right >= 9 && !state.awarded.mini){ state.awarded.mini = true; state.xp += 10; toast('🟢 +10 XP — мини-игра пройдена на отлично'); }
}
function touchToday(){
  var t = todayStr();
  if(state.seen.indexOf(t) < 0) state.seen.push(t);
  if(state.seen.length > 60) state.seen = state.seen.slice(-60);
}
function streak(){
  var set = {}, arr = state.seen.slice().sort(), s = 0;
  arr.forEach(function(d){ set[d] = true; });
  var d = new Date();
  if(!set[todayStr()]) d.setDate(d.getDate()-1);
  while(set[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function rankOf(xp){
  var cur = RANKS[0], next = null, ni = 0;
  for(var i=0;i<RANKS.length;i++){ if(xp >= RANKS[i].min){ cur = RANKS[i]; ni = i; } }
  next = RANKS[ni+1] || null;
  var from = cur.min, to = next ? next.min : cur.min + 400;
  var pct = next ? Math.min(100, Math.round((xp-from)/(to-from)*100)) : 100;
  return { cur:cur, next:next, pct:pct };
}
function jarsNow(){
  var j = { spend:0, save:0, share:0 };
  state.tx.forEach(function(t){ j.spend += t.ds; j.save += t.dv; j.share += t.dr; });
  return j;
}
function weekMissions(){
  var wn = weekNumber(new Date()) % MISSIONS.length;
  var out = [];
  for(var i=0;i<4;i++){ out.push(MISSIONS[(wn + i*3) % MISSIONS.length]); }
  return out;
}
function missionsDoneCount(){ return Object.keys(state.missionsDone).filter(function(k){ return state.missionsDone[k]; }).length; }
function lessonState(id){
  var m = MODULES.find(function(x){ return x.id === id; });
  if(id === 'l2m2' && state.demoLesson) return { st:'done', score:state.demoLesson.score };
  if(m && m.demo) return { st:'open' };
  if(m && m.lvl === 0) return { st:'open' };
  return { st:'locked' };
}
function achEarned(id){
  var s = state, j = jarsNow();
  switch(id){
    case 'first_lesson': return !!s.demoLesson;
    case 'quiz5':        return !!(s.demoLesson && s.demoLesson.score === 5);
    case 'mini9':        return !!(s.miniGame && s.miniGame.right >= 9);
    case 'streak3':      return streak() >= 3;
    case 'jar1000':      return j.save >= 1000;
    case 'goal':         return s.goal.target > 0 && j.save >= s.goal.target;
    case 'missions3':    return missionsDoneCount() >= 3;
    case 'tx5':          return s.tx.length >= 5;
  }
  return false;
}
function checkAch(loud){
  ACHS.forEach(function(a){
    if(!state.ach[a.id] && achEarned(a.id)){
      state.ach[a.id] = Date.now();
      if(loud){ toast('🏆 Новое достижение: «' + a.t + '»', true); }
    }
  });
}

/* ==================== тосты и модалка ==================== */
function toast(msg, gold){
  var el = document.createElement('div');
  el.className = 'toast' + (gold ? ' gold' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(function(){ el.style.opacity = '0'; el.style.transition = '.3s'; }, 2400);
  setTimeout(function(){ el.remove(); }, 2800);
}
function showModal(title, html, buttons){
  var box = $('#mbox');
  var bh = (buttons || []).map(function(b,i){
    return '<button class="btn ' + (b.cls||'') + '" data-mi="' + i + '">' + b.t + '</button>';
  }).join('');
  box.innerHTML = '<h3>' + title + '</h3>' + html + '<div class="mrow">' + bh + '</div>';
  box.querySelectorAll('[data-mi]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var b = buttons[+btn.getAttribute('data-mi')];
      closeModal();
      if(b && b.fn) b.fn();
    });
  });
  $('#modal').classList.add('show');
}
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

/* ==================== действия ==================== */
function addXp(n, why){
  var before = rankOf(state.xp).cur;
  state.xp += n;
  if(why) toast('+' + n + ' XP — ' + why);
  var after = rankOf(state.xp).cur;
  if(after.min !== before.min) toast('🎖 Новый ранг: ' + after.e + ' ' + after.t + '!', true);
}
function switchTab(name){
  $all('.snav').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab') === name); });
  $all('.tab').forEach(function(t){ t.classList.toggle('on', t.id === 'tab-' + name); });
  renderAll();
  window.scrollTo({top:0});
}
function setTxType(t){
  txType = t;
  $('#segIn').classList.toggle('on', t === 'in');
  $('#segIn').classList.toggle('in', t === 'in');
  $('#segOut').classList.toggle('on', t === 'out');
  $('#segOut').classList.toggle('out', t === 'out');
}
function addTx(){
  var a = Math.round(+($('#txAmount')||{}).value || 0);
  var note = (($('#txNote')||{}).value || '').trim() || (txType === 'in' ? 'Поступление' : 'Покупка');
  if(a <= 0){ toast('Введите сумму больше нуля'); return; }
  var j = jarsNow();
  if(txType === 'out' && a > j.spend + j.save + j.share){
    toast('🚫 Не хватает: во всех банках всего ' + rub(j.spend+j.save+j.share) + ' ₽'); return;
  }
  var ds=0, dv=0, dr=0, extra = '';
  if(txType === 'in'){
    ds = Math.round(a*0.5); dv = Math.round(a*0.4); dr = a - ds - dv;
  } else {
    var rest = a;
    var t1 = Math.min(rest, j.spend); ds = -t1; rest -= t1;
    var t2 = Math.min(rest, j.save); dv = -t2; rest -= t2;
    var t3 = Math.min(rest, j.share); dr = -t3; rest -= t3;
    if(t2 > 0) extra = ' (из копилки ' + rub(t2) + ' ₽)';
    if(t3 > 0) extra += ' (из «Делись» ' + rub(t3) + ' ₽)';
  }
  state.tx.push({ id:uid(), ts:Date.now(), type:txType, amount:a, note:esc(note), ds:ds, dv:dv, dr:dr });
  addXp(txType === 'in' ? 2 : 1, txType === 'in' ? 'доход записан' : 'расход записан');
  checkAch(true); save(); renderAll();
  if(extra) toast('⚠️ Пришлось взять ' + extra);
  var inp = $('#txAmount'); if(inp) inp.value = '';
  var ntp = $('#txNote'); if(ntp) ntp.value = '';
}
function delTx(id){
  state.tx = state.tx.filter(function(t){ return t.id !== id; });
  save(); renderAll(); toast('Запись удалена');
}
function toggleMission(mid){
  var m = MISSIONS.find(function(x){ return x.id === mid; });
  var k = weekKey() + '|' + mid;
  if(state.missionsDone[k]){
    delete state.missionsDone[k];
    state.xp = Math.max(0, state.xp - m.xp);
    toast('Миссия отменена, −' + m.xp + ' XP');
  } else {
    state.missionsDone[k] = true;
    addXp(m.xp, 'миссия «' + m.t + '» выполнена');
  }
  checkAch(true); save(); renderAll();
}
function saveGoal(){
  var n = (($('#gName')||{}).value || '').trim() || 'Цель';
  var t = Math.max(100, Math.round(+($('#gTarget')||{}).value || 0));
  state.goal = { name:n, target:t };
  checkAch(true); save(); renderAll(); toast('🎯 Цель обновлена: «' + esc(n) + '» за ' + rub(t) + ' ₽');
}
function applySettings(){
  var n = (($('#pName')||{}).value || '').trim();
  if(n) state.profile.name = n;
  state.profile.grade = (($('#pGrade')||{}).value || state.profile.grade);
  var w = Math.round(+($('#pWeekly')||{}).value || 0);
  if(w > 0) state.settings.weekly = w;
  save(); renderAll(); toast('⚙️ Настройки сохранены');
}
function openAvatarPicker(){
  var grid = '<div class="avgrid">' + AVATARS.map(function(a){
    return '<button onclick="setAvatar(\'' + a + '\')">' + a + '</button>';
  }).join('') + '</div>';
  showModal('Выбери аватар', grid, [{t:'Отмена', cls:'ghost'}]);
}
function setAvatar(a){
  state.profile.avatar = a;
  save(); renderAll(); closeModal(); toast('Аватар обновлён ' + a);
}
function openModule(id){
  var m = MODULES.find(function(x){ return x.id === id; });
  if(!m) return;
  var st = lessonState(id);
  if(st.st === 'done'){
    showModal('✅ ' + m.t, '<p>Урок пройден! Результат квиза: <b>' + st.score + ' из 5</b>. В полной версии здесь будет повторение и усложнённые задания.</p>',
      [{t:'Пройти снова', cls:'amber', fn:function(){ location.href = '../#demo'; }}, {t:'Закрыть', cls:'ghost'}]);
  } else if(m.demo){
    showModal('📘 Демо-урок: «Бюджет: собери 4 000 ₽»', '<p>Живая теория, игра «4 недели до цели», квиз и именной диплом. Прогресс засчитается в кабинете!</p>',
      [{t:'Пройти демо-урок →', cls:'amber', fn:function(){ location.href = '../#demo'; }}, {t:'Позже', cls:'ghost'}]);
  } else if(st.st === 'open'){
    showModal('📖 ' + m.t, '<p>Урок уровня «' + LEVELS[m.lvl].t + '» (' + LEVELS[m.lvl].gr + '). Длительность: ' + m.m + '.</p><p style="margin-top:8px">В тестовой версии открыт только демо-урок — полный контент появится в релизе.</p>',
      [{t:'Пройти демо-урок', cls:'amber', fn:function(){ location.href = '../#demo'; }}, {t:'Понятно', cls:'ghost'}]);
  } else {
    showModal('🔒 Пока закрыто', '<p>«' + m.t + '» — урок уровня «' + LEVELS[m.lvl].t + '» для ' + LEVELS[m.lvl].gr + '. Уровни открываются по порядку, а в тестовой версии доступен демо-урок уровня 2.</p>',
      [{t:'К демо-уроку', cls:'amber', fn:function(){ location.href = '../#demo'; }}, {t:'Понятно', cls:'ghost'}]);
  }
}
function loadDemoData(){
  var now = Date.now(), D = 86400000;
  var txs = [
    [21,'in',700,'Карманные, неделя 1'],[20,'out',60,'Сладости в субботу'],
    [19,'in',400,'Помог с большой уборкой'],[14,'in',700,'Карманные, неделя 2'],
    [12,'out',200,'Кафе с друзьями'],[7,'in',700,'Карманные, неделя 3'],
    [6,'out',400,'Кино с друзьями'],[3,'in',600,'Продал комиксы на «Авито»']
  ].map(function(r){
    var a = r[2], ds=0, dv=0, dr=0;
    if(r[1] === 'in'){ ds = Math.round(a*.5); dv = Math.round(a*.4); dr = a-ds-dv; }
    return { id:uid(), ts:now - r[0]*D, type:r[1], amount:a, note:r[3], ds:ds, dv:dv, dr:dr };
  });
  var wk = weekMissions().slice(0,2);
  var md = {};
  wk.forEach(function(m){ md[weekKey()+'|'+m.id] = true; });
  state = JSON.parse(JSON.stringify(DEFAULT));
  state.profile = { name:'Алиса', avatar:'🦊', grade:'5–7 класс' };
  state.demoLesson = { name:'Алиса', score:4, date: now - 5*D };
  state.miniGame = { right:9, total:10, date: now - 4*D };
  state.awarded = { demo:true, mini:true };
  state.tx = txs;
  state.missionsDone = md;
  state.xp = 265;
  state.seen = [todayStr()];
  [1,2,3,5].forEach(function(n){ var d=new Date(); d.setDate(d.getDate()-n); state.seen.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); });
  checkAch(false); save(); renderAll();
  toast('🎭 Демо-данные загружены — изучайте!', true);
}
function resetAll(){
  showModal('Сбросить всё?', '<p>Прогресс, копилка, миссии и достижения будут удалены безвозвратно.</p>',
    [{t:'Да, сбросить', cls:'red', fn:function(){ state = JSON.parse(JSON.stringify(DEFAULT)); save(); renderAll(); toast('Всё сброшено'); }},
     {t:'Отмена', cls:'ghost'}]);
}

/* ==================== рендер ==================== */
function greeting(){
  var h = new Date().getHours();
  return h < 12 ? 'Доброе утро' : (h < 18 ? 'Добрый день' : 'Добрый вечер');
}
function renderSide(){
  var r = rankOf(state.xp);
  $('#avatarBig').textContent = state.profile.avatar;
  $('#sideName').textContent = state.profile.name;
  $('#sideRank').textContent = r.cur.e + ' ' + r.cur.t;

function renderMap(){
  var h = '<h1 class="h-title">Программа курса</h1><p class="h-sub">24 модуля на 4 уровнях. Знания возвращаются каждый год — на новом уровне сложности.</p>';
  LEVELS.forEach(function(lv, li){

     a:'ИИС — индивидуальный инвестиционный счёт 📈 Счёт для покупки акций и облигаций с налоговой льготой: можно вернуть 13% от взноса (вычет типа А). Но помните:\n• Открыть ИИС можно с 18 лет (подростку — только через родителей)\n• Инвестиции — это риск: цена может и вырасти, и упасть\n• Сначала — финансовая база, потом биржа. Наш курс как раз её даёт 😉'},
    {k:['авито','продать','продаж','объявлен','барахолк','ненужные вещи'],
     a:'Продажа ненужного — самый простой первый доход 📦 Советы:\n• Честные фото и описание продают лучше звонких слов\n• Цену смотрите по похожим объявлениям и ставьте на 5–10% ниже\n• Безопасность: встречайтесь в людных местах, деньги — в момент передачи вещи\nЗаработанное — сразу в три банки! Это практика уровня «Умный потребитель».'},
    {k:['вклад','депозит','под процент','процент'],
     a:'Вклад — когда банк сам платит вам за хранение денег 🏦 Ставка зависит от ключевой (обычно 5–20% годовых), а вклады до 1,4 млн ₽ застрахованы государством. Отличие от копилки «под подушкой»: деньги работают и не съедаются инфляцией. Нюанс — у вклада есть срок: заберёте раньше — потеряете проценты.'},
    {k:['инфляц','дорожа','подорожа','цены растут','цены поднял'],
     a:'Инфляция — деньги постепенно теряют покупательную способность 📉 Сегодня мороженое 100 ₽, через пару лет — 120 ₽. Поэтому:\n• Копить «под подушкой» — медленно терять деньги\n• Держите в заначке только небольшой резерв, остальное — на цель или во вклад\nДети понимают инфляцию мгновенно, когда любимые сладкости дорожают 😄'},
    {k:['мошенн','обман','код из смс','смс код','звонок из банка','выиграл','приз','cvv','безопасн','украли деньги','взлом','развод'],
     a:'Главные правила финансовой безопасности 🛡\n• НИКОМУ не сообщайте коды из СМС и данные карты — даже «сотруднику банка»\n• «Вы выиграли приз, оплатите доставку» — всегда обман\n• Звонок «из банка» с просьбой срочно что-то сделать — кладите трубку и перезвоните сами по номеру на карте\n• Ребёнку: любые странные сообщения про деньги — сразу показываем родителям\nЭтому посвящён отдельный блок курса.'},
    {k:['кредит','рассрочк','в долг','займ','микрозайм','долг'],
     a:'Кредит — чужие деньги под проценты ⚠️ Телефон за 30 000 ₽ в кредит на год реально обойдётся в 34–36 000 ₽. До 18 лет кредит не выдают — и это к лучшему. Рассрочка честнее: процентов нет, но за пропуск платежа — штраф. Золотое правило курса: в долг не берём даже на «хочу» — сначала копим в банке «Копи» 🐷'},
    {k:['заработ','подработк','самозанят','первый доход','подработать'],
     a:'Первый доход — лучший учитель 💪 Что подходит подростку:\n• Продать ненужное на «Авито»\n• Помощь соседям: выгул собаки, полив цветов, курьерские доставки\n• Мини-услуги: помощь младшим с уроками, с компьютером\nС 14 лет можно оформить самозанятость (налог всего 4–6%). Главное — доход не «на всё сразу», а по трём банкам!'},
    {k:['курс доллара','курс долл','курс евр','курс валют','доллар','евро','валют','обмен валют','конверт'],
     a:'Курс валют — это цена одной валюты, выраженная в другой 🔄 Например, сколько рублей стоит один доллар. Курс меняется каждый день: на него влияют торговый баланс, процентные ставки и ожидания рынков.\nДля семьи это значит: поездки и покупки в валюте то дешевеют, то дорожают. Лайфхак: большие валютные покупки планируйте заранее и следите за курсом — но не играйте в спекуляции 😉'},
        {k:['курс','сколько стоит','цена','тариф','стоимост','записат','возраст','класс','сколько лет','купить'],
     a:'Курс «Рублик» — интерактивная финансовая грамотность для 2–11 классов 🎓 4 уровня: «Первые деньги» → «Умный потребитель» → «Личные финансы» → «Финансовая независимость». Уроки — как маленькие игры: банки, цели, квизы, миссии и дипломы.\nТарифы раннего доступа: 2 900 ₽ (один уровень) · 5 900 ₽ (все уровни) · 7 900 ₽ (семейный, до 3 детей). Демо-урок бесплатный — прямо на сайте!'},
    {k:['демо','демо урок','демо-урок','попробовать','протестиров','бесплатн','урок показать'],
     a:'Демо-урок — 15 минут, бесплатно и без регистрации 🎮 Это настоящий урок «Бюджет» для 5–7 классов: формула денег, правило трёх банок и игра «4 недели до цели» — принимаете решения вы, а копилка реагирует. Есть и мини-игра «Хочу/Нужно» для 8–10 лет. Кнопка «Демо-урок» — вверху страницы.'}
  ];
  var HEAVY = {'сбп':1,'иис':1,'ндфл':1,'вклад':1,'демо':1,'курс':1,'долг':1,'спс':1,'хай':1,'cvv':1,'акци':1,'бирж':1,'приз':1};
  var FALLBACK = 'Я консультирую только по финансовой грамотности 🪙 Спросите, например: «Как копить на цель?», «Что такое правило трёх банок?» или «Нужна ли ребёнку банковская карта?»';
  var GREETING = 'Привет! 👋 Я Рублик — консультант по финансовой грамотности.\nПомогу с копилкой, бюджетом, картами, кэшбэком и безопасностью. Или нажмите вопрос ниже 👇';

  function norm(s){ return ' ' + s.toLowerCase().replace(/ё/g,'е').replace(/!/g,' ').replace(/\?/g,' ') + ' '; }
  function findAnswer(q){
    var s = norm(q), best = null, bs = -1, bl = 0;
    for (var i = 0; i < KB.length; i++){
      var c = 0, L = 0;
      for (var j = 0; j < KB[i].k.length; j++){
        var kw = KB[i].k[j];
        if (s.indexOf(kw) !== -1){ c += (kw.length >= 5 ? 2 : 1) + (HEAVY[kw] ? 1 : 0); if (kw.length > L) L = kw.length; }
      }
      var sc = c * 10 + L;
      if (c > 0 && sc > bs){ bs = sc; best = KB[i]; }
    }
    return (best && bs >= 20) ? best : null;
  }
  function esc(s){ return s.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;'); }

  /* разметка */
  var root = document.createElement('div');
  root.className = 'rc-root';
  root.innerHTML = '<div class="rc-teaser" id="rcTeaser"><span data-ym-goal="chat_teaser_click">👋 Вопрос про деньги?</span><span class="rc-tx" data-ym-goal="chat_teaser_close" title="Скрыть">✕</span></div>'
    + '<button class="rc-fab" data-ym-goal="chat_open" aria-label="Открыть чат"><img class="rc-ic" src="' + ICON + '" alt="Рублик"><span class="rc-dot"></span></button>'
    + '<div class="rc-win" hidden>'
    + '<div class="rc-head"><span class="rc-ava"><img class="rc-ic" src="' + ICON + '" alt="Рублик"></span><div><b>Рублик</b><span class="rc-status"><i>●</i> онлайн · финконсультант</span></div><button class="rc-close" data-ym-goal="chat_close" aria-label="Закрыть">✕</button></div>'
    + '<div class="rc-msgs"></div>'
    + '<div class="rc-chips"></div>'
    + '<div class="rc-inputrow"><input type="text" placeholder="Спросите про деньги…" maxlength="300"><button class="rc-send" aria-label="Отправить">➤</button></div>'
    + '</div>';
  document.body.appendChild(root);

  var fab = root.querySelector('.rc-fab'), win = root.querySelector('.rc-win'),
      msgs = root.querySelector('.rc-msgs'), input = root.querySelector('input'),
      teaser = root.querySelector('.rc-teaser'), chips = root.querySelector('.rc-chips');

  var CHIPS = ['Правило трёх банок 🐷','Как копить на цель? 🎯','Что такое кэшбэк? 💸','Нужна ли ребёнку карта? 💳'];
  CHIPS.forEach(function(t){
    var b = document.createElement('button');
    b.className = 'rc-chip'; b.textContent = t;
    b.onclick = function(){ if (typeof ym === 'function'){ try { ym(CID, 'reachGoal', 'chat_chip', { chip: t }); } catch(e){} } send(t); };
    chips.appendChild(b);
  });

  function addMsg(w, t){
    var d = document.createElement('div');
    d.className = 'rc-m' + (w === 'me' ? ' rc-me' : ' rc-bot');
    d.innerHTML = (w === 'me' ? '' : '<span class="rc-mava"><img class="rc-ic" src="' + ICON + '" alt=""></span>') + '<div class="rc-bub">' + esc(t).split('\n').join('<br>') + '</div>';
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  function typing(){
    var t = document.createElement('div');
    t.className = 'rc-m rc-bot rc-typing';
    t.innerHTML = '<span class="rc-mava"><img class="rc-ic" src="' + ICON + '" alt=""></span><div class="rc-bub"><span class="rc-d"></span><span class="rc-d"></span><span class="rc-d"></span></div>';
    msgs.appendChild(t); msgs.scrollTop = msgs.scrollHeight; return t;
  }
  function agentSay(text, noDelay){
    if (noDelay){ addMsg('bot', text); return; }
    var t = typing();
    setTimeout(function(){ t.remove(); addMsg('bot', text); save(); }, 650 + Math.random() * 550);
  }
  function history(){
    try { return JSON.parse(lsGet(STORE) || '[]') || []; } catch(e){ return []; }
  }
  function save(){
    var out = [];
    for (var i = 0; i < msgs.children.length; i++){
      var m = msgs.children[i];
      if (m.classList.contains('rc-typing')) continue;
      out.push({ w: m.classList.contains('rc-me') ? 'me' : 'bot', t: m.querySelector('.rc-bub').textContent });
    }
    lsSet(STORE, JSON.stringify(out.slice(-40)));
  }
  function send(text){
    text = (text || '').trim(); if (!text) return;
    addMsg('me', text); save();
    var ans = findAnswer(text);
    if (typeof ym === 'function'){ try { ym(CID, 'reachGoal', 'chat_message', { q: text.slice(0, 100), hit: ans ? 1 : 0 }); } catch(e){} }
    agentSay(ans ? ans.a : FALLBACK);
  }

  function open(){
    win.hidden = false; fab.style.display = 'none'; teaser.style.display = 'none';
    lsSet(STORE + '_seen', '1');
    if (!msgs.children.length){
      var h = history();
      if (h.length){ h.forEach(function(m){ addMsg(m.w, m.t); }); }
      else { agentSay(GREETING, true); }
    }
    setTimeout(function(){ input.focus(); }, 60);
  }
  function close(){ win.hidden = true; fab.style.display = 'flex'; }

  fab.onclick = open;
  root.querySelector('.rc-close').onclick = close;
  root.querySelector('.rc-send').onclick = function(){ send(input.value); input.value = ''; };
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ send(input.value); input.value = ''; } });
  teaser.onclick = function(e){ if (e.target.classList.contains('rc-tx')) { teaser.style.display = 'none'; return; } open(); };
  setTimeout(function(){ if (win.hidden && lsGet(STORE + '_seen') !== '1') teaser.style.display = 'flex'; }, 6000);
})();
</script>
</body>
</html>
